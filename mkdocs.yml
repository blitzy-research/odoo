docs_dir: docs
site_name: 'blitzy-odoo'
site_description: >-
  Odoo 19.0 fork pursuing enterprise accounting parity — financial reporting
  engine and bank reconciliation — with an IBM Carbon Design System UI
  redesign as planned direction.
repo_url: https://github.com/Blitzy-Sandbox/blitzy-odoo
edit_uri: edit/19.0/docs/
nav:
  - Home: index.md
  - Project Guide: project-guide.md
  - Technical Specifications: technical-specifications.md
  - Change Archaeology & Review: change-archaeology-and-review.md
plugins:
  # Use Material search: MkDocs' core search script expects a `base_url`
  # global that the Material theme does not define.
  - techdocs-core:
      use_material_search: true
markdown_extensions:
  # Claim `mermaid` before TechDocs' default fence handler so diagrams emit
  # Mermaid markup instead of highlighted source.
  # Leave `format` unset: SuperFences already defaults to `fence_code_format`;
  # a Python-name YAML tag would require unsafe construction.
  # The portal must pin and integrity-check the client Mermaid runtime; see
  # docs/change-archaeology-and-review.md for the measured evidence.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
