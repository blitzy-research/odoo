docs_dir: docs
site_name: 'blitzy-odoo'
site_description: >-
  Odoo 19.0 fork pursuing enterprise accounting parity — financial reporting
  engine and bank reconciliation — with an IBM Carbon Design System UI
  redesign as planned direction.
repo_url: https://github.com/Blitzy-Sandbox/blitzy-odoo
edit_uri: edit/19.0/docs/
nav:
  - Home: index.md
  - Project Guide: project-guide.md
  - Technical Specifications: technical-specifications.md
  - Change Archaeology & Review: change-archaeology-and-review.md
plugins:
  # techdocs-core remains the sole declared plugin (AAP §0.8.1). The nested
  # mapping below sets one of the plugin's own documented options, so the
  # declared plugin list is still exactly [techdocs-core] and no ninth
  # top-level key is introduced.
  #
  # use_material_search: true selects mkdocs-material's search plugin instead
  # of MkDocs' core SearchPlugin. With the option off, that core plugin's
  # on_config appends the stock default-theme script search/main.js, which
  # dereferences a global `base_url` the Material theme never emits — an
  # uncaught ReferenceError on every page load. The Material plugin ships its
  # index through the theme bundle, so no stray script and no global is
  # required.
  #
  # KNOWN RESIDUAL, deliberately not worked around here: neither setting of
  # this option renders a search *control* on this package pairing.
  # techdocs-core registers whichever plugin it selects under the key "search"
  # (techdocs_core/core.py:L101), while the theme's header gates the control
  # on the key "material/search" (material/.../partials/header.html:L48), so
  # the condition can never hold. Three repository-side levers were measured
  # and none is taken: declaring material/search is forbidden by the
  # sole-plugin rule; a hooks: entry aliasing the key is out of reach, because
  # hooks sits outside the generator's supported-key allowlist and is deleted
  # before the portal build; and a theme.custom_dir override is an available
  # key rather than a forbidden one — theme is allowlisted and techdocs-core
  # preserves the override — but is declined, as a ninth top-level key
  # encoding a workaround for a vendor key-name mismatch. The fix
  # belongs in the portal-supplied bundle, and this configuration is its
  # precondition — proven by registering the selected plugin under
  # "material/search" in that package alone, which renders the control with
  # this file byte-identical. Unmet, the cost is confined to standalone
  # serving: Backstage removes .md-header wholesale and searches the
  # search_index.json published here, which this option keeps valid.
  - techdocs-core:
      use_material_search: true
markdown_extensions:
  # The custom fence claims the `mermaid` fence name before the techdocs-core
  # extension pack's default handling can render it as highlighted plain text,
  # and emits the body inside an element carrying `class="mermaid"`.
  #
  # `format:` is deliberately NOT declared, and must not be re-added.
  # SuperFences already defaults the formatter to the same callable --
  # `fence_format = custom.get('format', fence_code_format)` in its own
  # source -- so naming it changed no output at all, proven by building the
  # site with and without the key and diffing the two trees, which come out
  # byte-identical. What naming it did change is how this file has to be
  # parsed: a Python-name tag resolves only through PyYAML's unsafe
  # constructor, which imports the module named in the tag, and the
  # repository root precedes site-packages on `sys.path`. Omitting the key
  # leaves fence behaviour identical and lets `yaml.safe_load` read this
  # file. Quoting the tag as a string is NOT the equivalent fix: that hands
  # SuperFences a string where it expects a callable, silently breaking the
  # fence and returning the diagrams to highlighted plain text.
  #
  # SEC-02 — SECURITY DISPOSITION, recorded here because this is the exact
  # location the finding cites. `class: mermaid` is the selector the Material
  # 9.7.6 bundle matches on (`pre.mermaid`), so every diagram-bearing page
  # makes that bundle fetch and execute
  # https://unpkg.com/mermaid@11/dist/mermaid.min.js — a floating
  # major-version alias, ~3.57 MB, no digest, no integrity attribute, issued
  # in a request mode that makes integrity checking structurally impossible —
  # and latently https://unpkg.com/resize-observer-polyfill, which carries no
  # version specifier at all. Both URLs are compiled into the vendor theme
  # bundle (assets/javascripts/bundle.79ae519e.min.js, 114,308 bytes); this
  # file authors neither, and the published pages carry no CSP.
  #
  # The finding stays OPEN and is deliberately NOT claimed closed here. It is
  # the third portal-side prerequisite in section 7 of
  # docs/change-archaeology-and-review.md, whose subsection 7.2 carries the
  # measured evidence a portal operator needs, including the
  # subresource-integrity value of the concrete release measured. Four
  # repository-side levers were exhausted, each declined for a named reason
  # rather than for lack of capability:
  #   1. Self-host the runtime beside the site. Needs `extra_javascript`,
  #      which sits outside the publisher's supported-key allowlist and is
  #      deleted before the portal build. Fails on capability.
  #   2. Enable mkdocs-material's own privacy plugin, which downloads
  #      external assets at build time and rewrites them to local copies. It
  #      ships with the installed theme and it does work. But it is a second
  #      entry under `plugins`, and AAP 0.8.1 requires techdocs-core to
  #      remain the sole declared plugin, as does the `plugins` row of AAP
  #      0.6.3. Fails on scope; closing it needs separate authorisation.
  #   3. Rename or drop this fence so no runtime is ever requested. That
  #      re-opens blocker S2-02, so it is not a fix at all.
  #   4. Convert the seven diagrams to a notation techdocs-core renders
  #      server-side. AAP 0.5.1 considered and rejected exactly that in
  #      favour of this fence, AAP 0.5.5 keeps it only as a contingency, and
  #      it would be an unenumerated edit to two plan-protected documents.
  # The sole declared plugin offers no lever either: its whole option surface
  # is use_material_search and use_pymdownx_blocks (techdocs_core/core.py
  # L37-L38), neither of which touches the runtime origin.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
